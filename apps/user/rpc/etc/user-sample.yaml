Name: user.rpc
ListenOn: 0.0.0.0:10000
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: user.rpc

Mysql:
  DataSource: root:123456789@tcp(127.0.0.1:3306)/hichat2?charset=utf8mb4&parseTime=true

Cache:
  - Host: 127.0.0.1:6379
    Type: node

Jwt:
  AccessSecret: iceymoss.hichat.hichat2.com
  AccessExpire: 8640000

RootToken: your-root-token-here  # 新增配置项

Log:
  #  Mode: file      # 改为 file，控制台就清净了
  #  Path: logs      # 日志文件存放在 logs 目录下
  #  Stat: false     # 同时关掉统计日志
  Level: error  # 【关键】只打印 error 级别，info 和 stat 都会被屏蔽