syntax = "proto3";

package user;

option go_package = "./user";

// model
message UserEntity {
  string  id = 1;                // 用户id
  string  avatar = 2;            // 用户头像
  string  nickname = 3;          // 昵称
  string  phone  = 4;            // 手机号码
  string  email = 5;             // 邮件
  int32   status  = 6;           // 是否锁住
  int64   lastLogin = 7;         // 上次登陆时间
  int32   sex = 8;
  string  introduction = 9;
  int32   type = 10;             // 用户类别
  int32   state = 11;            // 用户状态
  string  region = 12;           // 地区
  string  occupation = 13;       // 职业
  string  tags = 14;             // 个人标签（JSON数组）
}

// req 与 respo
message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message LoginReq {
  string  phone = 1;
  string   email = 2;
  string  password = 3;
}

message LoginResp {
  string Token = 1;
  int64 expire = 2;
}

message RegisterReq{
  string  phone = 1;
  string  nickname = 2;
  string  password = 3;
  string  avatar = 4;
  string  type = 5;
  string  email = 6;
  int32   sex = 7;
  string  phoneCode = 8;  // 手机验证码（6位数）
}

message RegisterResp {
  string Token = 1;
  int64 expire = 2;
}

message GetUserInfoReq {
  string id = 1;
}

message GetUserInfoResp {
  UserEntity user = 1;
}

message FindUserReq {
  string name = 1;
  string phone = 2;
  repeated string ids = 3;
  string email = 4;
}

message FindUserResp {
  repeated UserEntity user = 1;
}

message UpdateUserReq {
  string id = 1;
  string name = 2;
  string phone = 3;
  string avatar = 5;
  string type = 6;
  string email = 7;
  int32   sex = 8;
  string introduction= 9;
  string password = 10;
  string region = 11;            // 地区
  string occupation = 12;        // 职业
  string tags = 13;              // 个人标签（JSON数组）
  string emailCode = 14;         // 邮箱验证码（绑定或修改邮箱时需要）
}

message UpdateUserResp {
  string id = 1;
}

message DeleteUserReq {
  string id = 1;
}

message DeleteUserResp {
}

message ResetPassWordReq {
  string id = 1;
  string password = 2;
}

message ResetPassWordResp {
}

// 发送验证邮件请求
message SendVerificationEmailRequest {
  string email = 1; // 用户邮箱
}

// 发送验证邮件响应
message SendVerificationEmailResponse {
  bool success = 1; // 是否发送成功
  string message = 2; // 附加信息
}

// 验证邮件请求
message VerifyEmailRequest {
  string email = 1; // 用户邮箱
  string code = 2; // 验证码
}

// 验证邮件响应
message VerifyEmailResponse {
  bool success = 1; // 是否验证成功
  string message = 2; // 附加信息
}

// 发送手机验证码请求
message SendPhoneCodeRequest {
  string phone = 1; // 用户手机号
}

// 发送手机验证码响应
message SendPhoneCodeResponse {
  bool success = 1; // 是否发送成功
  string message = 2; // 附加信息
}

// 验证手机验证码请求
message VerifyPhoneCodeRequest {
  string phone = 1; // 用户手机号
  string code = 2; // 验证码
}

// 验证手机验证码响应
message VerifyPhoneCodeResponse {
  bool success = 1; // 是否验证成功
  string message = 2; // 附加信息
}

message GetUserByIdRequest {
  string id = 1; // 用户id
}

message GetUserByIdResponse {
  UserEntity user = 1; // 用户信息
}

message GetUserByPhoneRequest {
  string phone = 1; // 用户手机号
}

message GetUserByPhoneResponse {
  UserEntity user = 1; // 用户信息
}

message GetUserByEmailRequest {
  string email = 1; // 用户邮箱
}

message GetUserByEmailResponse {
  UserEntity user = 1; // 用户信息
}



service User {
  rpc Ping(Request) returns (Response); // ping
  rpc Login(LoginReq) returns (LoginResp); // 登录
  rpc Register(RegisterReq) returns (RegisterResp);  // 注册
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp); // 获取用户信息
  rpc FindUser(FindUserReq) returns (FindUserResp); //查找用户
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp); // 更新用户信息
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp); // 删除用户
  rpc ResetPassword(ResetPassWordReq) returns (ResetPassWordResp); //重置密码
  rpc SendVerificationEmail(SendVerificationEmailRequest) returns (SendVerificationEmailResponse); // 发送验证邮件
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse); // 验证邮件
  rpc SendPhoneCode(SendPhoneCodeRequest) returns (SendPhoneCodeResponse); // 发送手机验证码
  rpc VerifyPhoneCode(VerifyPhoneCodeRequest) returns (VerifyPhoneCodeResponse); // 验证手机验证码
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse); // 根据id获取用户信息
  rpc GetUserByPhone(GetUserByPhoneRequest) returns (GetUserByPhoneResponse); // 根据手机号获取用户信息
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse); // 根据邮箱获取用户信息
}
