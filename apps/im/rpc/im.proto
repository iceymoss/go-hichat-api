syntax = "proto3";

package im;

option go_package = "./im";

// ------------ model -----------------

message ChatLog {
  string id = 1;
  string conversationId = 2;
  string sendId = 3;
  string recvId = 4;
  int32 msgType = 5;
  string msgContent = 6;
  int32 chatType = 7;
  int64 SendTime = 8;
  bytes readRecords = 9;
  // 每个成员的已读时间戳（unix nano），仅群聊/已读详情场景填充
  map<string, int64> readTimes = 10;
  // 引用/回复消息（JSON 字符串：{"id","name","preview"}）
  string quote = 11;
}

message Conversation {
  string conversationId = 1;
  int32 chatType = 2;
  string targetId = 3;
  bool isShow = 4;
  int64 seq = 5;
  // 总消息数
  int32 total = 6;
  // 未读消息数
  int32 toRead = 7;
  // 已读消息
  int32 Read = 9;
  ChatLog msg = 8;
  // 会话置顶（每用户每会话设置）
  bool isTop = 10;
  // 消息免打扰（每用户每会话设置）
  bool isMute = 11;
}

// ------------ req resp ---------------

message GetConversationsReq {
  string userId = 1;
}
message GetConversationsResp {
  map<string, Conversation> conversationList = 2;
}

message PutConversationsReq {
  string id = 1;
  string userId = 2;
  map<string, Conversation> conversationList = 3;
}
message PutConversationsResp {}

message GetChatLogReq {
  string conversationId = 1;
  int64 startSendTime = 2;
  int64 endSendTime = 3;
  int64 count = 4;
  string msgId = 5;
  // 分页方向：""/older=查更早（默认）, newer=查更新, around=目标消息及其前若干条（含目标）
  string direction = 6;
}
message GetChatLogResp {
  repeated ChatLog List = 1;
}

message SetUpUserConversationReq{
  string SendId = 1;
  string recvId = 2;
  int32 chatType = 3;
}

message SetUpUserConversationResp{}

message CreateGroupConversationReq {
  string GroupId = 1;
  string CreateId = 2;
}
message CreateGroupConversationResp {}

message SetConversationSettingsReq {
  string userId = 1;
  string conversationId = 2;
  bool isTop = 3;
  bool isMute = 4;
}
message SetConversationSettingsResp {}

service Im {
  // 获取会话记录
  rpc GetChatLog(GetChatLogReq) returns(GetChatLogResp);

  // 建立会话: 群聊, 私聊
  rpc SetUpUserConversation(SetUpUserConversationReq) returns(SetUpUserConversationResp);

  // 获取会话
  rpc GetConversations(GetConversationsReq) returns(GetConversationsResp);

  // 更新会话
  rpc PutConversations(PutConversationsReq)  returns(PutConversationsResp);

  // 创建群会话
  rpc CreateGroupConversation(CreateGroupConversationReq) returns(CreateGroupConversationResp);

  // 设置会话置顶/免打扰
  rpc SetConversationSettings(SetConversationSettingsReq) returns(SetConversationSettingsResp);
}

