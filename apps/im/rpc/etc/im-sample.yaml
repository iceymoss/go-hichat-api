Name: im.rpc
ListenOn: 0.0.0.0:10002

Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: im.rpc

SocialRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: social.rpc
    Timeout: 10000     # 超时10秒
    RetryCount: 5      # 重试5次
    RetryInterval: 500 # 每次重试间隔500ms
    NonBlock: true     # 非阻塞模式

Log:
  #  Mode: file      # 改为 file，控制台就清净了
  #  Path: logs      # 日志文件存放在 logs 目录下
  #  Stat: false     # 同时关掉统计日志
  Level: error  # 【关键】只打印 error 级别，info 和 stat 都会被屏蔽

