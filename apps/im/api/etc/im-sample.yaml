Name: im
Host: 0.0.0.0
Port: 8890
# 仅供本地开发；生产环境使用 HICHAT_IM_RPC_AUTH_SECRET 覆盖
RpcAuthSecret: hichat-local-im-rpc-auth-secret-change-me-2026
# 富媒体上传上限：120MB（覆盖 go-zero 默认 1MB，给 100MB 文件留 multipart 余量）
MaxBytes: 125829120

SocialRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: social.rpc

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

ImRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: im.rpc

# 撤回事件专用的 Kafka topic（与 mq 消费端一致）
MsgRecallTransfer:
  Topic: msgRecallTransfer
  Addrs:
    - 127.0.0.1:9092


JwtAuth:
  AccessSecret: iceymoss.hichat.hichat2.com
  AccessExpire: 8640000
Upload:
  BasePath: ./temp
  BaseURL: http://localhost:8887/static
