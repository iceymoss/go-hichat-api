Name: im.ws
ListenOn: 0.0.0.0:10091

Mysql:
  DataSource: root:123456789@tcp(127.0.0.1:3306)/hichat2?charset=utf8mb4&parseTime=true

Cache:
  - Host: 127.0.0.1:6379
    Type: node

MsgChatTransfer:
  Name: msgChatTransfer
  Brokers:
    - 127.0.0.1:9092
  Group: kafka
  Topic: msgChatTransfer
  Offset: first
  Consumers: 1

MsgReadTransfer:
  Name: msgReadTrans
  Brokers:
    - 127.0.0.1:9092
  Group: kafka
  Topic: msgReadTransfer
  Offset: first
  Consumers: 1

MsgRecallTransfer:
  Name: msgRecallTrans
  Brokers:
    - 127.0.0.1:9092
  Group: kafka
  Topic: msgRecallTransfer
  Offset: first
  Consumers: 1

TrendNotifyTransfer:
  Name: trendNotifyTrans
  Brokers:
    - 127.0.0.1:9092
  Group: kafka
  Topic: trendNotifyTransfer
  Offset: first
  Consumers: 1

Ws:
  Host: 127.0.0.1:10090

SocialRpc:
  Target: dns:///127.0.0.1:10001
  NonBlock: true
  Timeout: 10000

UserRpc:
  Target: dns:///127.0.0.1:10000
  NonBlock: true
  Timeout: 10000

ImRpc:
  Target: dns:///127.0.0.1:10002
  NonBlock: true
  Timeout: 10000

Log:
  Level: error

RelationChangeTransfer:
  Name: relationChangeTrans
  Brokers:
    - 127.0.0.1:9092
  Group: kafka
  Topic: relationChangeTransfer
  Offset: first

# 发送鉴权灰度开关：默认 false=现状行为（不校验，fail-open）；验证缓存/事件链路无误后分粒度打开
AuthzGate:
  Enabled: false
  GroupChat: false
  SingleChat: false
