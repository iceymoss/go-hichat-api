<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一对一视频通话 - WebRTC Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c757d;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.matching {
            background: #ffc107;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-container {
            position: relative;
            padding: 30px;
            background: #000;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-height: 500px;
        }

        .video-wrapper {
            position: relative;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
        }

        .video-wrapper.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 14px;
        }

        .controls {
            padding: 20px 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #000;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .messages {
            padding: 20px 30px;
            max-height: 150px;
            overflow-y: auto;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .message {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 13px;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .videos {
                grid-template-columns: 1fr;
            }

            .status {
                font-size: 12px;
            }

            button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 一对一视频通话</h1>
            <p>基于 WebRTC 的实时视频通话</p>
        </div>

        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>
            <div class="status-item">
                <span>客户端 ID: <strong id="clientId">-</strong></span>
            </div>
            <div class="status-item">
                <span>对端 ID: <strong id="peerId">-</strong></span>
            </div>
        </div>

        <div class="video-container">
            <div class="videos">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">本地视频</div>
                </div>
                <div class="video-wrapper empty" id="remoteVideoWrapper">
                    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
                    <span id="remoteVideoPlaceholder">等待对方加入...</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="startCall()">
                <span>📹</span> 开始通话
            </button>
            <button class="btn-danger" id="hangupBtn" onclick="hangup()" disabled>
                <span>📞</span> 挂断
            </button>
            <button class="btn-warning" id="muteBtn" onclick="toggleMute()" disabled>
                <span id="muteIcon">🎤</span> <span id="muteText">静音</span>
            </button>
            <button class="btn-secondary" id="videoBtn" onclick="toggleVideo()" disabled>
                <span id="videoIcon">📹</span> <span id="videoText">关闭视频</span>
            </button>
        </div>

        <div class="messages" id="messages">
            <div class="message info">💡 提示：点击"开始通话"连接到服务器，系统将自动为您匹配对方</div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
