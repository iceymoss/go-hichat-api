syntax = "proto3";

package trend;

option go_package = "./trend";


import "google/protobuf/timestamp.proto";  // 导入时间戳类型

// 动态服务接口定义
service TrendService {
  // 发布动态
  rpc CreateTrend(CreateTrendRequest) returns (CreateTrendResponse);

  // 删除动态
  rpc DeleteTrend(DeleteTrendRequest) returns (DeleteTrendResponse);

  // 更新动态
  rpc UpdateTrend(UpdateTrendRequest) returns (UpdateTrendResponse);

  // 获取动态列表
  rpc ListTrends(ListTrendsRequest) returns (ListTrendsResponse);

  // 获取单个动态详情
  rpc GetTrendDetail(GetTrendDetailRequest) returns (GetTrendDetailResponse);

  // 获取最新动态
  rpc GetLatestTrends(GetLatestTrendsRequest) returns (GetLatestTrendsResponse);

  // 获取用户个人动态列表
  rpc GetUserTrends(GetUserTrendsRequest) returns (GetUserTrendsResponse);

  // 评论服务定义
  // 动态评论相关模块
  // 1. 发表一级评论（父评论ID=0）
  rpc CreateRootDiscuss(CreateDiscussReq) returns (CreateDiscussResp);

  // 2. 发表多级评论（二级、三级等）
  rpc CreateChildDiscuss(CreateDiscussReq) returns (CreateDiscussResp);

  // 3. 获取动态的多级评论树（树形结构）
  rpc GetTrendDiscusses(GetDiscussesReq) returns (DiscussesTreeResp);

  // 4. 获取一级评论（分页）
  rpc GetRootDiscusses(GetDiscussesReq) returns (DiscussesListResp);

  // 5. 获取子评论（指定父评论下的所有评论）
  rpc GetChildDiscusses(GetChildDiscussesReq) returns (DiscussesListResp);

  // 6. 删除评论（支持任意级别评论删除）
  rpc DeleteDiscuss(DeleteDiscussReq) returns (DeleteDiscussResp);

  // 7. 获取未读回复
  rpc GetUnreadReplies(GetUnreadRepliesReq) returns (RepliesListResp);

  // 8. 标记评论为已读
  rpc MarkDiscussRead(MarkDiscussRequest) returns (MarkDiscussResponse);

  // 点赞/取消点赞
  rpc ToggleLike(LikeToggleRequest) returns (LikeToggleResponse);

  // 获取动态点赞摘要 (用于动态下方展示)
  rpc GetTrendLikeSummary(GetTrendLikeSummaryRequest) returns (GetTrendLikeSummaryResponse);

  // 批量获取点赞摘要 (用于动态流)
  rpc BatchGetTrendLikeSummary(BatchTrendLikeSummaryRequest) returns (BatchTrendLikeSummaryResponse);

  // 获取点赞用户列表 (微信"查看全部点赞")
  rpc GetLikedUsers(GetLikedUsersRequest) returns (GetLikedUsersResponse);

  // 获取未读点赞通知
  rpc GetUnreadLikes(GetUnreadLikesRequest) returns (GetUnreadLikesResponse);

  // 标记点赞为已读
  rpc MarkLikesRead(MarkLikesReadRequest) returns (MarkLikesReadResponse);
}


// ========== 枚举类型定义 ==========

// 动态内容类型
enum TrendType {
  TREND_TYPE_UNSPECIFIED = 0;  // 未指定类型（应避免使用）
  TEXT = 1;        // 纯文本动态
  MIXED = 2;       // 图文混合动态
  ARTICLE = 3;     // 长文动态（带标题）
  SHARE = 4;       // 第三方内容分享（如文章/视频）
  VIDEO = 5;       // 视频动态
  AD = 6;          // 广告动态（需特殊处理）
}

// 动态可见范围
enum VisibilityScope {
  SCOPE_UNSPECIFIED = 0;  // 未指定范围（应避免使用）
  PRIVATE = 1;      // 好友圈可见（朋友圈）
  FRIENDS = 2;      // 仅自己可见
  ALL     = 3;      // 全部
}

// 公共论坛状态
enum PublicState {
  PUBLIC_STATE_UNSPECIFIED = 0;  // 未指定状态
  PUBLIC_DRAFT = 1;     // 草稿状态（未发布）
  PUBLIC_PUBLISHED = 2; // 已发布（正常展示）
  PUBLIC_PENDING = 3;   // 审核中（临时状态）
  PUBLIC_DELETED = 4;   // 已删除（不可见）
}

// ========== 消息结构定义 ==========

// 动态中使用的资源项（图片/视频）
message Resource {
  string url = 1;          // 资源访问URL
  string content_type = 2; // MIME类型：image/jpeg, video/mp4
  int32 width = 3;         // 资源宽度（像素）
  int32 height = 4;        // 资源高度（像素）
  int32 duration = 5;      // 视频时长（秒）
  int32 sort = 6;          // 资源排序位置
}

// 动态核心数据结构
message Trend {
  int64 id = 1;           // 动态唯一ID
  int64 user_id = 2;       // 发布用户ID

  // 动态基本信息
  TrendType type = 3;       // 动态类型
  string content = 4;       // 文本内容
  VisibilityScope scope = 7; // 可见范围

  // 时间管理
  int64 create_time = 10; // 原始创建时间

  // 互动数据
  int32 reply_count = 11;   // 评论数量
  int32 agree_count = 12;   // 点赞数量

  // 附加信息
  string position_name = 13;       // 位置信息
  repeated float position_point = 21; // 经纬度
  string title = 14;          // 长文标题（类型3）
  repeated int32 at_user_ids = 15;  // @的用户ID列表

  // 内容资源
  repeated string resources = 16;  // 图片/视频资源
  string cover_url = 18;       // 封面图URL（视频/长文）
  string share_url = 19;       // 第三方分享链接

  // 功能开关
  int32 open_reply = 17;        // 是否允许评论

  // 系统信息
  string device_id = 20;       // 发布设备ID
  string ip = 22;              // ip信息
}

// 分页参数
message Pagination {
  int32 last_id = 1;       // 游标id
  int64 last_time = 2;  // 游标时间
}

// 分页信息
message PageInfo {
  int32 last_id = 1; // keyset分页
  int64 last_time = 2; // keyset分页
}

message Point {
  double longitude = 1;  // 经度
  double latitude = 2;   // 纬度
}
// ========== 服务接口请求/响应 ==========

// 1. 发布动态请求
message CreateTrendRequest {
  int64 user_id = 1;            // 发布用户ID（必须）
  TrendType type = 2;            // 动态类型（必须）
  string content = 3;            // 正文内容（必须）
  VisibilityScope scope = 4;      // 可见范围（必须）
  repeated string resources = 5; // 关联的资源（可选）
  string position_name = 6;            // 位置信息（可选）
  Point position_point = 14;          // 坐标信息
  string title = 7;               // 长文标题（可选）
  repeated int32 at_user_ids = 8;   // @的用户ID列表（可选）
  bool open_reply = 9;            // 是否允许评论（默认开启）
  string cover_url = 10;          // 封面图URL（类型3/5可选）
  string share_url = 11;          // 分享链接（类型4/5可选）
  string device = 12;             // 客户端设备id
  string ip = 13;                 // 客户端ip
}

// 发布动态响应
message CreateTrendResponse {
  int64 trend_id = 1;                       // 新创建的动态ID
  int64 code = 3;                           // 状态信息：1000:成功，2000:动态内容包含敏感信息
}

// 2. 删除目标枚举
enum DeleteTarget {
  DELETE_TARGET_UNSPECIFIED = 0;  // 未指定目标
  DELETE_CIRCLE_ONLY = 1;   // 仅删除朋友圈部分
  DELETE_PUBLIC_ONLY = 2;   // 仅删除论坛部分
  DELETE_BOTH = 3;          // 同时删除两个平台
}

// 删除动态请求
message DeleteTrendRequest {
  int64 trend_id = 1;  // 要删除的动态ID（必须）
  int64 user_id = 2;    // 执行删除的用户ID（用于验证）
}

// 删除动态响应
message DeleteTrendResponse {
  bool success = 1;  // 删除操作是否成功
}

// 3. 更新动态请求
message UpdateTrendRequest {
  int64 trend_id = 1;  // 要更新的动态ID（必须）
  int64 user_id = 2;    // 执行更新的用户ID（用于验证）

  // 可更新的字段（每次请求只能更新一个）
  oneof update_field {
    string content = 3;       // 更新正文内容
    string title = 4;          // 更新标题
    VisibilityScope scope = 5; // 更新可见范围
    bool open_reply = 6;       // 更新评论状态
    string cover_url = 7;      // 更新封面图
    string share_url = 8;      // 更新分享链接
  }
}

// 更新动态响应
message UpdateTrendResponse {
  Trend trend = 1;  // 更新后的完整动态数据
}

// 4. 获取动态列表请求
message ListTrendsRequest {
  Pagination pagination = 1;       // 分页参数（必须）
  repeated TrendType types = 2;    // 按类型过滤（可选）
  string sortColum  = 3;           // 排序字段
  int32 sortType   = 4;            // 排序方向
  repeated string userIds = 5;     // 用户id
}

// 动态列表响应
message ListTrendsResponse {
  repeated Trend trends = 1;  // 动态列表数据
  PageInfo page_info = 2;     // 分页信息
}

// 5. 动态详情请求
message GetTrendDetailRequest {
  int64 trend_id = 1;  // 要查询的动态ID（必须）
}

// 动态详情响应
message GetTrendDetailResponse {
  Trend trend = 1;  // 动态详细信息
}

// 6. 动态流类型
enum FeedType {
  FEED_TYPE_UNSPECIFIED = 0;  // 未指定类型
  FEED_FRIENDS = 1;  // 朋友圈动态流
  FEED_PUBLIC = 2;   // 公共论坛动态流
  FEED_HOT = 3;      // 热门动态流
}

// 获取最新动态请求（用于动态流）
message GetLatestTrendsRequest {
  VisibilityScope type = 1;            // 动态流类型（必须）
  repeated string user_ids = 2;     // 好友id
  int64 last_trend_id = 3;         // 上一次加载的最后一条动态ID（用于分页）
  int32 count = 4;                // 请求数量（默认30）
}

// 最新动态响应
message GetLatestTrendsResponse {
  repeated Trend trends = 1;      // 动态列表
  int64 last_trend_id = 2;         // 本次返回的最后一条动态ID（用于下次分页）
  bool has_more = 3;              // 是否还有更多数据
}

// 7. 获取用户动态列表请求
message GetUserTrendsRequest {
  string target_user_id = 1;  // 要查询的用户ID（必须）
  VisibilityScope scope = 3;   // 可见范围过滤（可选）
  Pagination pagination = 4;   // 分页参数（必须）
}

// 8. 标记评论为已读
message MarkDiscussRequest {
  uint32 user_id = 1;            // 当前用户ID
  repeated uint64 dis_ids = 2;  // 要标记的点赞ID
}

message MarkDiscussResponse {
}

// 用户动态列表响应
message GetUserTrendsResponse {
  repeated Trend trends = 1;  // 用户的动态列表
  PageInfo page_info = 2;      // 分页信息
}

// ========== 数据结构定义 ==========

// 评论基本信息
message Discuss {
  uint64 id = 1;           // 评论ID
  uint64 trend_id = 2;      // 所属动态ID
  uint64 father = 3;        // 父评论ID（0表示一级评论）
  uint64 root_id = 4;        // 根评论ID（多级评论的祖先ID）
  uint64 replyer = 5;       // 评论者用户ID
  uint64 user_id = 6;       // 被评论者用户ID
  uint32 level = 7;         // 评论层级（1=一级,2=二级...）
  string content = 8;       // 评论内容
  repeated uint64 at_user_ids = 9; // @用户的ID列表
  uint64 agree_count = 10;   // 点赞数
  uint64 discuss_count = 11; // 子评论数量
  uint32 state = 12;         // 状态（0=已删除,1=正常）
  bool read = 13;           // 已读状态（true=已读）
  int64 create_time = 14;   // 创建时间(时间戳)
  int64 update_time = 15;   // 更新时间(时间戳)
  repeated Discuss children = 16; // 子评论（树形结构时使用）
}

// 分页参数
message DiscussPagination {
  int32 page = 1;    // 当前页码（从1开始）
  int32 size = 2;    // 每页条数
}

// ========== 请求/响应结构 ==========

// 创建评论请求
message CreateDiscussReq {
  uint64 trend_id = 1;       // 动态ID
  uint64 father = 2;         // 父评论ID（创建一级评论时为0）
  uint64 user_id = 3;        // 被评论者用户ID
  string content = 4;        // 评论内容
  repeated uint64 at_user_ids = 5; // @的用户ID列表
  uint64 replyer = 6;        // 评论者用户ID
}

// 创建评论响应
message CreateDiscussResp {
  Discuss discuss = 1;      // 创建的评论信息
}

// 获取评论请求
message GetDiscussesReq {
  uint64 trend_id = 1;      // 动态ID
  Pagination pagination = 2; // 分页参数（可选）
  bool include_children = 3; // 是否包含子评论（树形结构）
  repeated string uids = 4; // 好友id
}

// 评论树形响应
message DiscussesTreeResp {
  repeated Discuss discusses = 1; // 树形评论列表（一级评论包含子评论）
  Pagination pagination = 2;      // 分页信息
}

// 评论列表响应
message DiscussesListResp {
  repeated Discuss discusses = 1; // 评论列表
  Pagination pagination = 2;      // 分页信息
  uint64 total = 3;               // 总数
}

// 获取子评论请求
message GetChildDiscussesReq {
  uint64 root_id = 1;        // 根评论ID
  uint64 father = 2;         // 父评论ID
  Pagination pagination = 3; // 分页参数
}

// 删除评论请求
message DeleteDiscussReq {
  uint64 id = 1;             // 要删除的评论ID
}

// 删除评论响应
message DeleteDiscussResp {
  bool success = 1;          // 是否成功
}

// 获取未读回复请求
message GetUnreadRepliesReq {
  uint64 user_id = 1;        // 用户ID
  Pagination pagination = 2;  // 分页参数
}

// 未读回复列表响应
message RepliesListResp {
  repeated Discuss replies = 1; // 未读回复列表
  Pagination pagination = 2;    // 分页信息
  uint64 total = 3;             // 总数
}

// ===== 核心数据类型 =====

// 点赞信息 (与微信接口对齐)
message LikeInfo {
  uint64 id = 1;                 // 点赞记录ID
  uint32 user_id = 2;            // 点赞用户ID
  uint32 trend_id = 5;           // 动态ID
  int64  create_time = 6; // 点赞创建时间
}

// 动态点赞摘要
message TrendLikeSummary {
  uint32 trend_id = 1;           // 动态ID
  uint32 like_count = 2;         // 点赞总数
  bool is_liked = 3;             // 当前用户是否点赞
  repeated LikeInfo preview_likes = 4; // 预览点赞用户 (最多3个)
  uint32 count = 5;      // 预览显示的数字
}

// ===== 请求/响应消息 =====

// 点赞/取消点赞请求 (微信使用单一接口)
message LikeToggleRequest {
  uint32 user_id = 1;            // 操作用户ID
  uint32 trend_id = 2;           // 目标动态ID
  uint32 author_id = 3;           // 动态作者ID (防止伪造)
  int32  like_type = 4;           // 1点赞，-1取消点赞
}

// 点赞/取消点赞响应
message LikeToggleResponse {
  bool success = 1;              // 操作是否成功
  string error_message = 4;      // 错误信息
}

// 获取动态点赞摘要请求
message GetTrendLikeSummaryRequest {
  uint32 user_id = 1;            // 当前用户ID
  uint32 trend_id = 2;           // 动态ID
}

// 获取动态点赞摘要响应
message GetTrendLikeSummaryResponse {
  TrendLikeSummary summary = 1;
}

// 获取点赞用户列表请求 (微信的"查看更多")
message GetLikedUsersRequest {
  uint32 trend_id = 1;           // 动态ID
  uint32 cursor = 2;             // 分页游标
  uint32 limit = 3;              // 每页数量 (默认20)
}

// 获取点赞用户列表响应
message GetLikedUsersResponse {
  repeated LikeInfo users = 1;   // 点赞用户列表
  uint32 next_cursor = 2;        // 下一页游标(0表示结束)
  bool has_more = 3;             // 是否有更多
  uint32 total = 4;              // 总数
}

// 获取未读点赞通知请求
message GetUnreadLikesRequest {
  uint32 user_id = 1;            // 当前用户ID (作者ID)
  uint32 last_id = 2;            // 分页id
}

// 获取未读点赞通知响应
message GetUnreadLikesResponse {
  repeated LikeInfo likes = 1;   // 未读点赞列表
  uint32 total_unread = 2;       // 未读总数
  uint32 last_id = 3;            // 游标
}

// 标记已读请求
message MarkLikesReadRequest {
  uint32 user_id = 1;            // 当前用户ID
  repeated uint64 like_ids = 2;  // 要标记的点赞ID
}

message MarkLikesReadResponse {

}

// ===== 批量操作 =====

// 批量获取点赞摘要请求
message BatchTrendLikeSummaryRequest {
  uint32 user_id = 1;            // 当前用户ID
  repeated uint32 trend_ids = 2;  // 动态ID列表
}

// 批量获取点赞摘要响应
message BatchTrendLikeSummaryResponse {
  map<uint32, TrendLikeSummary> summaries = 1; // key=trend_id
}