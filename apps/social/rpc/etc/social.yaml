Name: social.rpc
ListenOn: 0.0.0.0:8080
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: social.rpc

# 关系变更事件 Kafka 生产端（relay 投递到 task/mq 消费）
RelationChangeTransfer:
  Addrs:
    - 127.0.0.1:9092
  Topic: relationChangeTransfer

# 公共通知事件 Kafka 生产端（好友/群申请等实时通知，直接 Push 到 task/mq 消费）
CommonNotifyTransfer:
  Addrs:
    - 127.0.0.1:9092
  Topic: commonNotifyTransfer
