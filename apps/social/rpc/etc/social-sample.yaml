Name: social.rpc
ListenOn: 127.0.0.1:10001
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: social.rpc

Mysql:
  DataSource: iceymoss:Yk?123456@tcp(127.0.0.1:3306)/hichat2?charset=utf8mb4&parseTime=true

Cache:
  - Host: 127.0.0.1:6379
    Type: node

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

Log:
  #  Mode: file      # 改为 file，控制台就清净了
  #  Path: logs      # 日志文件存放在 logs 目录下
  #  Stat: false     # 同时关掉统计日志
  Level: error  # 【关键】只打印 error 级别，info 和 stat 都会被屏蔽

