syntax = "proto3";

package social;

option go_package = "./social";

// model
message Friends {
  int32  id = 1;     //关系id
  string userId = 2; //用户id
  string remark = 3; //标记
  int32  addSource = 4; // 添加来源
  string friendUid = 5; //朋友id
  bool   blacklisted = 6; // 拉黑
  int32  momentsPermission = 7; // 朋友圈权限 0允许 1仅聊天 2屏蔽
  bool   notifyEnabled = 8; // 消息通知 1开 0关
  bool   pinned = 9; // 置顶
  bool   muted = 10; // 静音
  repeated string friendTags = 11; // 好友标签
}

message FriendRequests { //好友请求
  int32  id = 1;  //请求id
  string userId = 2; //用户id
  string reqUid = 3; //请求用户id
  string reqMsg = 4; //请求消息
  int32  status = 7; //消息状态（0:已删除 1:正常显示 2:忽略不显示）
  int64  reqTime = 5; //请求时间
  int32  handleResult = 6; // 处理结果
  int32  readState = 8; // [新增] 读取状态 0未读 1已读
}

message Groups { //群
  string id = 1; //群id
  string name = 2; //群名称
  string icon = 3; //群图片
  int32  status = 4; //状态
  string creator_uid = 5; //群主
  int32  groupType = 6; //群类型
  bool   isVerify = 7; //是否验证
  string notification = 8; // 公告通知
  string notificationUid = 9; //公告发起者
}

message GroupMembers { //群成员
  int32  id = 1; //id
  string groupId = 2; //群id
  string userId = 3; //用户id
  int32  roleLevel = 6; //用户所在群中级别
  int64  joinTime = 7; //加入时间
  int32  joinSource = 8; //加入来源
  string inviterUid = 9; //邀请人
  string operatorUid = 10; //存在人
}

message GroupRequests { //
  int32  id = 1;
  string groupId = 2; //群id
  string reqId = 3; //请求id
  string reqMsg = 4; //请求消息
  int64  reqTime = 5; //请求时间
  int32  joinSource = 6; //请求来源
  string inviterUid = 7; //邀请人
  string handleUid = 8; //处理人
  int32  handleResult = 9; // 处理结果
  int64  handleResultTime = 10; // 处理时间
}

message GroupQuitReq {
  string userId = 1;
  string groupId = 2;
}
message GroupQuitResp {}

message GroupKickReq {
  string userId = 1; // Operator (Admin)
  string groupId = 2;
  repeated string memberIds = 3; // Members to kick
}
message GroupKickResp {}

message GroupInviteReq {
  string userId = 1; // Operator/Inviter
  string groupId = 2;
  repeated string friendIds = 3;
}
message GroupInviteResp {}

message GroupUpdateReq {
  string userId = 1; // Operator
  string groupId = 2;
  string name = 3;
  string icon = 4;
  string notification = 5;
  string notificationUid = 6;
}
message GroupUpdateResp {}

message GroupDetailReq {
  string groupId = 1;
}
message GroupDetailResp {
  Groups group = 1;
  repeated GroupMembers members = 2;
}

// req resp

message FriendPutInReq {
  string userId = 2;
  string reqUid = 3;
  string reqMsg = 4;
  int64  reqTime = 5;
}
message FriendPutInResp {}

message FriendPutInHandleReq {
  int32  friendReqId = 1;
  string userId = 2;
  int32  handleResult = 3; // 处理结果
  string remark = 4;       // [新增] 备注
  repeated string tags = 5; // [新增] 标签
}
message FriendPutInHandleResp {}

message FriendPutInReadReq {
  string userId = 1;
  int32  friendReqId = 2; // 0 表示全部已读
}
message FriendPutInReadResp {}

message FriendPutInListReq{
  string userId = 1;
  int32  type = 2; //获取什么类型：已拒绝；已通过，未处理
  string class = 3; //申请列表类型：0我发起的申请列表；1我接受到的好友申请列表
}

message FriendPutInListResp{
  repeated FriendRequests list = 1;
}

message FriendPutInMessageCountReq{
  string userId = 1;
}

message FriendPutInMessageCountResp{
  int32 count = 1; // 消息数量
}

message FriendListReq{
  string userId = 1;
}

message FriendListResp{
  repeated Friends list = 1;
}

// 好友管理扩展
message FriendUpdateRemarkReq {
  string userId = 1;
  string friendUid = 2;
  string remark = 3;
}
message FriendUpdateRemarkResp {}

message FriendDeleteReq {
  string userId = 1;
  string friendUid = 2;
}
message FriendDeleteResp {}

message FriendBlockReq {
  string userId = 1;
  string friendUid = 2;
  bool   block = 3;
}
message FriendBlockResp {}

message FriendMomentsPermissionReq {
  string userId = 1;
  string friendUid = 2;
  int32  permission = 3; // 0允许 1仅聊天 2屏蔽
}
message FriendMomentsPermissionResp {}

message FriendNotificationReq {
  string userId = 1;
  string friendUid = 2;
  bool   enabled = 3;
}
message FriendNotificationResp {}

message FriendPinReq {
  string userId = 1;
  string friendUid = 2;
  bool   pinned = 3;
}
message FriendPinResp {}

message FriendMuteReq {
  string userId = 1;
  string friendUid = 2;
  bool   muted = 3;
}
message FriendMuteResp {}

message FriendTagsReq {
  string userId = 1;
  string friendUid = 2;
  repeated string tags = 3;
}
message FriendTagsResp {}

message FriendReportReq {
  string userId = 1;
  string friendUid = 2;
  string reason = 3;
}
message FriendReportResp {}

message FriendShareReq {
  string userId = 1;
  string friendUid = 2;
  string targetUid = 3;
}
message FriendShareResp {}

// 群
message GroupCreateReq { //创建群
  string name = 2;
  string icon = 3;
  int32  status = 4;
  string creator_uid = 5;
}
message GroupCreateResp {
  string groupId = 1;
}

message GroupPutinReq {
  string groupId = 2;
  string reqId = 3;
  string reqMsg = 4;
  int64  reqTime = 5;
  int32  joinSource = 6;
  string inviterUid = 7;
}
message GroupPutinResp {
  int32 groupId = 1;
  int32 isPass = 2;
}

message GroupPutinListReq {
  string groupId = 1;
  repeated int32  type = 2; //获取处理类型：未处理，已通过，已拒绝
  int32  class = 3; //1：我发起的申请， 2：我接受到的申请
  string userId = 4; // 用户id
}
message GroupPutinListResp {
  repeated GroupRequests list = 1;
}

message GroupPutInHandleReq {
  int32  groupReqId = 1;
  string groupId = 2;
  string handleUid = 3;
  int32  handleResult = 4; // 处理结果

  string username = 6;
  string userAvatarUrl = 7;
}
message GroupPutInHandleResp {
  string groupId = 1;
}

message GroupListReq{
  string userId = 1;
}
message GroupListResp{
  repeated Groups list = 1;
}

message GroupUsersReq {
  string groupId = 1;
}
message GroupUsersResp {
  repeated GroupMembers List = 1;
}

message FindGroupListReq {
  repeated string ids = 1; //群id
}

message FindGroupListResp {
  repeated Groups list = 1;
}


// svc
service social {
  // 好友业务：请求好友、通过或拒绝申请、好友列表
  rpc FriendPutIn(FriendPutInReq) returns(FriendPutInResp);
  rpc FriendPutInHandle(FriendPutInHandleReq) returns(FriendPutInHandleResp);
  rpc FriendPutInRead(FriendPutInReadReq) returns(FriendPutInReadResp);
  rpc FriendPutInList(FriendPutInListReq) returns(FriendPutInListResp);
  rpc FriendPutInMessageCount(FriendPutInMessageCountReq) returns(FriendPutInMessageCountResp);
  rpc FriendList(FriendListReq) returns (FriendListResp);
  rpc FriendUpdateRemark(FriendUpdateRemarkReq) returns (FriendUpdateRemarkResp);
  rpc FriendDelete(FriendDeleteReq) returns (FriendDeleteResp);
  rpc FriendBlock(FriendBlockReq) returns (FriendBlockResp);
  rpc FriendMomentsPermission(FriendMomentsPermissionReq) returns (FriendMomentsPermissionResp);
  rpc FriendNotification(FriendNotificationReq) returns (FriendNotificationResp);
  rpc FriendPin(FriendPinReq) returns (FriendPinResp);
  rpc FriendMute(FriendMuteReq) returns (FriendMuteResp);
  rpc FriendTags(FriendTagsReq) returns (FriendTagsResp);
  rpc FriendReport(FriendReportReq) returns (FriendReportResp);
  rpc FriendShare(FriendShareReq) returns (FriendShareResp);

  // 群业务：创建群，修改群，群公告，申请群，用户群列表，群成员，申请群，群退出..
  // 群要求
  rpc GroupCreate(GroupCreateReq) returns (GroupCreateResp);
  rpc GroupPutin(GroupPutinReq) returns (GroupPutinResp);
  rpc GroupPutinList(GroupPutinListReq) returns (GroupPutinListResp);
  rpc GroupPutInHandle(GroupPutInHandleReq) returns(GroupPutInHandleResp);
  rpc GroupList(GroupListReq) returns (GroupListResp);
  rpc GroupUsers(GroupUsersReq) returns (GroupUsersResp);
  rpc FindGroupList(FindGroupListReq) returns (FindGroupListResp);
  
  rpc GroupQuit(GroupQuitReq) returns (GroupQuitResp);
  rpc GroupKick(GroupKickReq) returns (GroupKickResp);
  rpc GroupInvite(GroupInviteReq) returns (GroupInviteResp);
  rpc GroupUpdate(GroupUpdateReq) returns (GroupUpdateResp);
  rpc GroupDetail(GroupDetailReq) returns (GroupDetailResp);
}
