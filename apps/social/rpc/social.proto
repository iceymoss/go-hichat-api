syntax = "proto3";

package social;

option go_package = "./social";

// model
message Friends {
  int32  id = 1;     //关系id
  string userId = 2; //用户id
  string remark = 3; //标记
  int32  addSource = 4; // 添加来源
  string friendUid = 5; //朋友id
  bool   blacklisted = 6; // 拉黑
  int32  momentsPermission = 7; // 朋友圈权限 0允许 1仅聊天 2屏蔽
  bool   notifyEnabled = 8; // 消息通知 1开 0关
  bool   pinned = 9; // 置顶
  bool   muted = 10; // 静音
  repeated string friendTags = 11; // 好友标签
}

message FriendRequests { //好友请求
  int32  id = 1;  //请求id
  string userId = 2; //用户id
  string reqUid = 3; //请求用户id
  string reqMsg = 4; //请求消息
  int32  status = 7; //消息状态（0:已删除 1:正常显示 2:忽略不显示）
  int64  reqTime = 5; //请求时间
  int32  handleResult = 6; // 处理结果
  int32  readState = 8; // [新增] 读取状态 0未读 1已读
  uint64 requestId = 9;
  string peerUid = 10;
  string handleMsg = 11;
  int64 handledAt = 12;
  bool actionable = 13;
}

message Groups { //群
  string id = 1; //群id
  string name = 2; //群名称
  string icon = 3; //群图片
  int32  status = 4; //状态
  string creator_uid = 5; //群主
  int32  groupType = 6; //群类型
  bool   isVerify = 7; //是否验证
  string notification = 8; // 公告通知
  string notificationUid = 9; //公告发起者
  string groupNickname = 10; // 当前用户在该群的昵称
  string groupRemark = 11; // 当前用户对该群的备注
  string description = 12; // 群描述
}

message GroupMembers { //群成员
  int32  id = 1; //id
  string groupId = 2; //群id
  string userId = 3; //用户id
  int32  roleLevel = 6; //用户所在群中级别
  int64  joinTime = 7; //加入时间
  int32  joinSource = 8; //加入来源
  string inviterUid = 9; //邀请人
  string operatorUid = 10; //存在人
  string groupNickname = 11; //群内昵称
  string groupRemark = 12; //群备注
}

message GroupRequests { //
  int32  id = 1;
  string groupId = 2; //群id
  string reqId = 3; //请求id
  string reqMsg = 4; //请求消息
  int64  reqTime = 5; //请求时间
  int32  joinSource = 6; //请求来源
  string inviterUid = 7; //邀请人
  string handleUid = 8; //处理人
  int32  handleResult = 9; // 处理结果
  int64  handleResultTime = 10; // 处理时间
  int32  receiverRead = 11; // 接收方(群主/管理员)已读 0未读 1已读
  uint64 requestId = 12;
  string applicantUid = 13;
  string handleMsg = 14;
  string invalidReason = 15;
  int32 actualJoinSource = 16;
  int32 sourceType = 17;
  uint64 sourceInvitationId = 18;
  int32 readState = 19;
  bool actionable = 20;
}

message GroupQuitReq {
  string userId = 1;
  string groupId = 2;
}
message GroupQuitResp {}

message GroupKickReq {
  string userId = 1; // Operator (Admin)
  string groupId = 2;
  repeated string memberIds = 3; // Members to kick
}
message GroupKickResp {}

message GroupInviteReq {
  string userId = 1; // Operator/Inviter
  string groupId = 2;
  repeated string friendIds = 3;
  string actorUid = 4; // 当前操作者；公开 API 只能从 JWT 填充
}
message GroupInviteResp {
  repeated uint64 invitationIds = 1;
}

message GroupUpdateReq {
  string userId = 1; // Operator
  string groupId = 2;
  string name = 3;
  string icon = 4;
  string notification = 5;
  string notificationUid = 6;
  int32  isVerify = 7; // 入群验证：-1不修改 0不需要 1需要
  string description = 8; // 群描述
}
message GroupUpdateResp {}

message GroupDetailReq {
  string groupId = 1;
}
message GroupDetailResp {
  Groups group = 1;
  repeated GroupMembers members = 2;
}

// ---------------- 邀请链接/二维码入群 ----------------
message GroupInviteLink {
  string token = 1;
  string groupId = 2;
  string createdBy = 3;
  int64  createdAt = 4;
  int64  expireAt = 5; // 0=永不过期
  int32  maxUses = 6;  // 0=无限
  int32  usedCount = 7;
  bool   revoked = 8;
  int64  revokedAt = 9;
}

message GroupInviteLinkCreateReq {
  string userId = 1; // Operator（群成员）
  string groupId = 2;
  int64  expireSeconds = 3; // 0=永不过期
  int32  maxUses = 4; // 0=无限
}
message GroupInviteLinkCreateResp {
  GroupInviteLink link = 1;
}

message GroupInviteLinkListReq {
  string userId = 1;
  string groupId = 2;
  bool   includeRevoked = 3;
}
message GroupInviteLinkListResp {
  repeated GroupInviteLink list = 1;
}

message GroupInviteLinkRevokeReq {
  string userId = 1;
  string groupId = 2;
  string token = 3;
}
message GroupInviteLinkRevokeResp {}

message GroupJoinByTokenReq {
  string userId = 1; // 当前登录用户
  string token = 2;
  string reqMsg = 3;
}
message GroupJoinByTokenResp {
  int32 groupId = 1;
  int32 isPass = 2; // 1=直接进群 0=进入申请流程
}

// ---------------- 群成员资料（群内昵称/群备注/@列表） ----------------
message GroupMemberSetting {
  string groupId = 1;
  string userId = 2;
  string groupNickname = 3;
  string groupRemark = 4;
  int64  updatedAt = 5;
}

message GetMyGroupMemberSettingReq {
  string userId = 1;
  string groupId = 2;
}
message GetMyGroupMemberSettingResp {
  GroupMemberSetting setting = 1;
}

message UpdateMyGroupMemberSettingReq {
  string userId = 1;
  string groupId = 2;
  string groupNickname = 3;
  string groupRemark = 4;
}
message UpdateMyGroupMemberSettingResp {}

message AtMember {
  string userId = 1;
  string nickname = 2;       // 用户昵称
  string groupNickname = 3;  // 群内昵称（可空）
  string avatar = 4;         // 由 API 层补齐
  int32  roleLevel = 5;
}

message GroupAtListReq {
  string userId = 1;
  string groupId = 2;
  string keyword = 3; // 可选：按昵称/群内昵称过滤（API层也可做）
}
message GroupAtListResp {
  repeated AtMember list = 1;
}

message GetMemberRoleReq {
  string groupId = 1;
  string userId = 2;
}
message GetMemberRoleResp {
  int32 roleLevel = 1; // 0=普通 1=管理员 2=群主
  bool  isMember = 2;  // 不在群时为 false，roleLevel 无意义
}

// ---------------- 公告历史/置顶 ----------------
message GroupAnnouncement {
  int64  id = 1;
  string groupId = 2;
  string content = 3;
  string createdBy = 4;
  int64  createdAt = 5;
  bool   pinned = 6;
  int64  pinnedAt = 7;
}

message GroupAnnouncementCreateReq {
  string userId = 1; // admin/owner
  string groupId = 2;
  string content = 3;
}
message GroupAnnouncementCreateResp {
  int64 id = 1;
}

message GroupAnnouncementListReq {
  string userId = 1;
  string groupId = 2;
  bool   includeDeleted = 3;
}
message GroupAnnouncementListResp {
  repeated GroupAnnouncement list = 1;
}

message GroupAnnouncementPinReq {
  string userId = 1; // admin/owner
  string groupId = 2;
  int64  announcementId = 3;
  bool   pinned = 4; // true=置顶 false=取消置顶
}
message GroupAnnouncementPinResp {}

// 解散群
message GroupDisbandReq {
  string userId = 1; // Operator（必须群主）
  string groupId = 2;
}
message GroupDisbandResp {}

// 转让群主
message GroupTransferOwnerReq {
  string userId = 1; // Operator（必须群主）
  string groupId = 2;
  string newOwnerId = 3; // 新群主（必须已在群内）
  bool   keepOldOwnerAsAdmin = 4; // 旧群主是否保留为管理员（默认 true）
}
message GroupTransferOwnerResp {}

// 设置/取消管理员
message GroupSetAdminReq {
  string userId = 1; // Operator（必须群主）
  string groupId = 2;
  repeated string memberIds = 3;
  bool isAdmin = 4; // true=设为管理员 false=取消管理员
}
message GroupSetAdminResp {}

// req resp

message FriendPutInReq {
  string userId = 2;
  string reqUid = 3;
  string reqMsg = 4;
  int64  reqTime = 5;
  string remark = 6; // 申请人为对方预设的备注（对方通过后写入申请人侧好友关系）
  string actorUid = 7; // 当前操作者；公开 API 只能从 JWT 填充
}
message FriendPutInResp {
  int64 requestId = 1;
  int32 status = 2; // 0=pending, 1=accepted, 2=rejected
  bool alreadyPending = 3;
  bool alreadyFriend = 4;
}

message FriendPutInHandleReq {
  int32  friendReqId = 1;
  string userId = 2;
  int32  handleResult = 3; // 处理结果
  string remark = 4;       // [新增] 备注
  repeated string tags = 5; // [新增] 标签
  string handleMsg = 6;    // 处理附言/回复
  string actorUid = 7;     // 当前操作者；公开 API 只能从 JWT 填充
  uint64 requestId = 8;
}
message FriendPutInHandleResp {
  int64 requestId = 1;
  int32 handleResult = 2;
  bool idempotent = 3;
}

message FriendPutInReadReq {
  string userId = 1;
  int32  friendReqId = 2; // 0 表示全部已读
  repeated uint64 requestIds = 3;
}
message FriendPutInReadResp {
  int32 count = 1;
  int32 apply = 2;
  int32 result = 3;
}

message FriendPutInDeleteReq {
  string userId = 1;
  int32  friendReqId = 2;
  uint64 requestId = 3;
}
message FriendPutInDeleteResp {}

message FriendPutInListReq{
  string userId = 1;
  int32  type = 2; //获取什么类型：已拒绝；已通过，未处理
  string class = 3; //申请列表类型：0我发起的申请列表；1我接受到的好友申请列表
  optional int32 status = 4;
  int32 page = 5;
  int32 size = 6;
}

message FriendPutInListResp{
  repeated FriendRequests list = 1;
  int64 total = 2;
}

message FriendPutInMessageCountReq{
  string userId = 1;
}

message FriendPutInMessageCountResp{
  int32 count = 1; // 消息数量
  int32 apply = 2;
  int32 result = 3;
}

message FriendListReq{
  string userId = 1;
}

message FriendListResp{
  repeated Friends list = 1;
}

// 好友管理扩展
message FriendUpdateRemarkReq {
  string userId = 1;
  string friendUid = 2;
  string remark = 3;
}
message FriendUpdateRemarkResp {}

message FriendDeleteReq {
  string userId = 1;
  string friendUid = 2;
}
message FriendDeleteResp {}

message FriendBlockReq {
  string userId = 1;
  string friendUid = 2;
  bool   block = 3;
}
message FriendBlockResp {}

message FriendMomentsPermissionReq {
  string userId = 1;
  string friendUid = 2;
  int32  permission = 3; // 0允许 1仅聊天 2屏蔽
}
message FriendMomentsPermissionResp {}

message FriendNotificationReq {
  string userId = 1;
  string friendUid = 2;
  bool   enabled = 3;
}
message FriendNotificationResp {}

message FriendPinReq {
  string userId = 1;
  string friendUid = 2;
  bool   pinned = 3;
}
message FriendPinResp {}

message FriendMuteReq {
  string userId = 1;
  string friendUid = 2;
  bool   muted = 3;
}
message FriendMuteResp {}

message FriendTagsReq {
  string userId = 1;
  string friendUid = 2;
  repeated string tags = 3;
}
message FriendTagsResp {}

message FriendReportReq {
  string userId = 1;
  string friendUid = 2;
  string reason = 3;
}
message FriendReportResp {}

message FriendShareReq {
  string userId = 1;
  string friendUid = 2;
  string targetUid = 3;
}
message FriendShareResp {}

// 群
message GroupCreateReq { //创建群
  string name = 2;
  string icon = 3;
  int32  status = 4;
  string creator_uid = 5;
  string description = 6; // 群描述
}
message GroupCreateResp {
  string groupId = 1;
}

message GroupPutinReq {
  string groupId = 2;
  string reqId = 3;
  string reqMsg = 4;
  int64  reqTime = 5;
  int32  joinSource = 6;
  string inviterUid = 7;
  string actorUid = 8; // 当前操作者；主动申请必须与 reqId 一致
}
message GroupPutinResp {
  int32 groupId = 1;
  int32 isPass = 2;
  uint64 requestId = 3;
  int32 status = 4; // 0=pending, 1=accepted, 2=rejected
  bool alreadyPending = 5;
  bool alreadyMember = 6;
  string groupIdString = 7;
}

message GroupPutinListReq {
  string groupId = 1;
  repeated int32  type = 2; //获取处理类型：未处理，已通过，已拒绝
  int32  class = 3; //1：我发起的申请， 2：我接受到的申请
  string userId = 4; // 用户id
}
message GroupPutinListResp {
  repeated GroupRequests list = 1;
  int64 total = 2;
}

message GroupPutInHandleReq {
  int32  groupReqId = 1;
  string groupId = 2;
  string handleUid = 3;
  int32  handleResult = 4; // 处理结果

  string username = 6;
  string userAvatarUrl = 7;
  string actorUid = 8; // 当前操作者；公开 API 只能从 JWT 填充
  string handleMsg = 9;
  uint64 requestId = 10; // 新客户端使用；groupReqId 仅兼容旧客户端
}
message GroupPutInHandleResp {
  string groupId = 1;
  string reqId = 2; // 被处理的入群申请用户ID（通过后需要用它建立群会话）
  uint64 requestId = 3;
  int32 handleResult = 4;
  bool idempotent = 5;
}

message GroupInvitation {
  uint64 id = 1;
  string groupId = 2;
  string inviterUid = 3;
  string inviteeUid = 4;
  int32 inviterRoleSnapshot = 5;
  string message = 6;
  int32 status = 7; // 0=pending, 1=accepted, 2=rejected, 3=expired, 4=invalidated
  string rejectReason = 8;
  int64 createdAt = 9;
  int64 handledAt = 10;
  int64 expiresAt = 11;
  int32 readState = 12;
  bool actionable = 13;
}

message GroupInvitationCreateReq {
  string actorUid = 1;
  string groupId = 2;
  string inviteeUid = 3;
  string message = 4;
}
message GroupInvitationCreateResp {
  GroupInvitation invitation = 1;
}

message GroupInvitationListReq {
  string actorUid = 1;
  int32 status = 2; // -1=all, 0..4=具体状态
  int32 page = 3;
  int32 size = 4;
}
message GroupInvitationListResp {
  repeated GroupInvitation list = 1;
  int64 total = 2;
}

message GroupInvitationHandleReq {
  uint64 id = 1;
  string actorUid = 2;
  int32 result = 3; // 1=accept, 2=reject
  string handleMsg = 4;
}
message GroupInvitationHandleResp {
  uint64 invitationId = 1;
  int32 status = 2;
  string joinState = 3; // joined|pending_approval|approval_rejected|rejected|expired|invalidated
  uint64 groupRequestId = 4;
  bool idempotent = 5;
  string groupId = 6;
}

message GroupInvitationReadReq {
  string actorUid = 1;
  repeated uint64 invitationIds = 2;
}
message GroupInvitationReadResp {
  int32 count = 1;
  int32 apply = 2;
  int32 result = 3;
  int32 invite = 4;
}

message GroupRequestMessageCountReq { string userId = 1; }
message GroupRequestMessageCountResp {
  int32 count = 1;
  int32 apply = 2;
  int32 result = 3;
  int32 invite = 4;
}

message GroupListReq{
  string userId = 1;
}
message GroupListResp{
  repeated Groups list = 1;
}

message GroupUsersReq {
  string groupId = 1;
}
message GroupUsersResp {
  repeated GroupMembers List = 1;
}

message FindGroupListReq {
  repeated string ids = 1; //群id
}

message FindGroupListResp {
  repeated Groups list = 1;
}

message GetGroupPutListByUidReq {
  repeated string ids = 1;  // 用户id
  string class = 2;         // 类别： 1：我发起的申请， 2：我接受到的申请
  string type = 3;          // 状态： 0未处理，1已通过，2已拒绝，3忽略
  optional int32 status = 4;
  int32 page = 5;
  int32 size = 6;
}

// 群搜索（群号精确 + 群名模糊，分页）
message GroupSearchReq {
  string keyword = 1; // 群号(精确) 或 群名(模糊)
  int64  page = 2;    // 页码，从1开始
  int64  size = 3;    // 每页大小
}
message GroupSearchItem {
  string id = 1;
  string name = 2;
  string icon = 3;
  string description = 4;
  string creator_uid = 5;
  int64  member_count = 6; // 群成员数
}
message GroupSearchResp {
  repeated GroupSearchItem list = 1;
  int64 total = 2; // 匹配总数
}

message MarkGroupReqReadReq {
  string userId = 1; // 当前用户（群主/管理员），把其管理的群收到的申请标记已读
  repeated uint64 requestIds = 2;
}
message MarkGroupReqReadResp {
  int32 count = 1;
  int32 apply = 2;
  int32 result = 3;
  int32 invite = 4;
}


// svc
service social {
  // 好友业务：请求好友、通过或拒绝申请、好友列表
  rpc FriendPutIn(FriendPutInReq) returns(FriendPutInResp); // 请求好友申请
  rpc FriendPutInHandle(FriendPutInHandleReq) returns(FriendPutInHandleResp); // 申请好友处理
  rpc FriendPutInRead(FriendPutInReadReq) returns(FriendPutInReadResp); // 标记申请消息已读
  rpc FriendPutInDelete(FriendPutInDeleteReq) returns(FriendPutInDeleteResp); // 删除好友申请记录（软删除，status=0）
  rpc FriendPutInList(FriendPutInListReq) returns(FriendPutInListResp); // 获取好友申请列表,包括：1.我发起的申请列表；2. 获取我接受到的申请列表
  rpc FriendPutInMessageCount(FriendPutInMessageCountReq) returns(FriendPutInMessageCountResp); // 获取申请消息数量
  rpc FriendList(FriendListReq) returns (FriendListResp); // 获取好友列表
  rpc FriendUpdateRemark(FriendUpdateRemarkReq) returns (FriendUpdateRemarkResp); // 修改好友备注
  rpc FriendDelete(FriendDeleteReq) returns (FriendDeleteResp); // 删除好友
  rpc FriendBlock(FriendBlockReq) returns (FriendBlockResp); // 屏蔽好友
  rpc FriendMomentsPermission(FriendMomentsPermissionReq) returns (FriendMomentsPermissionResp); // 朋友圈权限
  rpc FriendNotification(FriendNotificationReq) returns (FriendNotificationResp); // 推荐好友
  rpc FriendPin(FriendPinReq) returns (FriendPinResp); // 好友置顶
  rpc FriendMute(FriendMuteReq) returns (FriendMuteResp); // 拉黑
  rpc FriendTags(FriendTagsReq) returns (FriendTagsResp); // 标签
  rpc FriendReport(FriendReportReq) returns (FriendReportResp); // 举报
  rpc FriendShare(FriendShareReq) returns (FriendShareResp); // 分享

  // 群业务：创建群，修改群，群公告，申请群，用户群列表，群成员，申请群，群退出..
  // 群要求
  rpc GroupCreate(GroupCreateReq) returns (GroupCreateResp); // 创建群
  rpc GroupPutin(GroupPutinReq) returns (GroupPutinResp); // 申请群:1.发起加群申请；2.群主或者管理员邀请加入；3.群成员邀请加入
  rpc GroupPutinList(GroupPutinListReq) returns (GroupPutinListResp); // 群的角度：获取群申请列表，包括：1.我发起的申请列表；2. 获取我接受到的申请列表
  rpc GetGroupPutListByUid(GetGroupPutListByUidReq) returns (GroupPutinListResp); // 用户的角度：获取群申请列表
  rpc MarkGroupReqRead(MarkGroupReqReadReq) returns(MarkGroupReqReadResp); // 把我管理的群收到的申请标记已读
  rpc GroupPutInHandle(GroupPutInHandleReq) returns(GroupPutInHandleResp); // 处理群申请
  rpc GroupList(GroupListReq) returns (GroupListResp); // 获取群列表
  rpc GroupUsers(GroupUsersReq) returns (GroupUsersResp); // 获取群成员列表
  rpc FindGroupList(FindGroupListReq) returns (FindGroupListResp); // 获取多个用户的群列表
  rpc GroupSearch(GroupSearchReq) returns (GroupSearchResp); // 搜索群（群号精确+群名模糊，分页）
  
  rpc GroupQuit(GroupQuitReq) returns (GroupQuitResp); // 退出群
  rpc GroupKick(GroupKickReq) returns (GroupKickResp); // 踢群成员
  rpc GroupUpdate(GroupUpdateReq) returns (GroupUpdateResp); // 修改群信息
  rpc GroupDetail(GroupDetailReq) returns (GroupDetailResp); // 获取群详情
  rpc GroupDisband(GroupDisbandReq) returns (GroupDisbandResp); // 解散群
  rpc GroupTransferOwner(GroupTransferOwnerReq) returns (GroupTransferOwnerResp); // 转移群主
  rpc GroupSetAdmin(GroupSetAdminReq) returns (GroupSetAdminResp); // 设置群管理员
  rpc GroupInvite(GroupInviteReq) returns (GroupInviteResp); // 邀请好友入群

  // 邀请链接/二维码入群
  rpc GroupInviteLinkCreate(GroupInviteLinkCreateReq) returns (GroupInviteLinkCreateResp); // 创建群邀请链接
  rpc GroupInviteLinkList(GroupInviteLinkListReq) returns (GroupInviteLinkListResp); // 获取群邀请链接
  rpc GroupInviteLinkRevoke(GroupInviteLinkRevokeReq) returns (GroupInviteLinkRevokeResp); // 撤销群邀请链接
  rpc GroupJoinByToken(GroupJoinByTokenReq) returns (GroupJoinByTokenResp); // 通过邀请链接入群

  // 群成员资料（群内昵称/群备注/@列表）
  rpc GetMyGroupMemberSetting(GetMyGroupMemberSettingReq) returns (GetMyGroupMemberSettingResp); // 获取群成员资料
  rpc UpdateMyGroupMemberSetting(UpdateMyGroupMemberSettingReq) returns (UpdateMyGroupMemberSettingResp); // 修改群成员资料
  rpc GroupAtList(GroupAtListReq) returns (GroupAtListResp); // 获取群@列表
  rpc GetMemberRole(GetMemberRoleReq) returns (GetMemberRoleResp); // 点查群成员角色（撤回/@所有人鉴权用）

  // 公告历史/置顶
  rpc GroupAnnouncementCreate(GroupAnnouncementCreateReq) returns (GroupAnnouncementCreateResp); // 创建群公告
  rpc GroupAnnouncementList(GroupAnnouncementListReq) returns (GroupAnnouncementListResp); // 获取群公告
  rpc GroupAnnouncementPin(GroupAnnouncementPinReq) returns (GroupAnnouncementPinResp); // 置顶群公告
  rpc GroupInvitationCreate(GroupInvitationCreateReq) returns (GroupInvitationCreateResp); // 创建独立群邀请
  rpc GroupInvitationList(GroupInvitationListReq) returns (GroupInvitationListResp); // 查询当前用户收到的邀请
  rpc GroupInvitationRead(GroupInvitationReadReq) returns (GroupInvitationReadResp); // 标记当前用户展示的邀请已读
  rpc GroupRequestMessageCount(GroupRequestMessageCountReq) returns (GroupRequestMessageCountResp); // 群申请与邀请个人未读
  rpc GroupInvitationHandle(GroupInvitationHandleReq) returns (GroupInvitationHandleResp); // 接受或拒绝群邀请
}
