Name: streaming.service
ListenOn: 0.0.0.0:10093

# JWT 鉴权：与 im/user 共用同一 AccessSecret
JwtAuth:
  AccessSecret: iceymoss.hichat.hichat2.com
  AccessExpire: 8640000

Mysql:
  DataSource: root:123456789@tcp(127.0.0.1:3306)/hichat2?charset=utf8mb4&parseTime=true

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: easy-chat

# WebRTC 配置
WebRTC:
  # ICE服务器配置
  IceServers:
    - URLs:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"
    - URLs:
        - "turn:your-turn-server.com:3478"
      Username: "username"
      Credential: "password"
  
  # 媒体配置
  Media:
    # 视频配置
    Video:
      Width: 1280
      Height: 720
      FrameRate: 30
      Bitrate: 1000000  # 1Mbps
    
    # 音频配置
    Audio:
      SampleRate: 48000
      Channels: 2
      Bitrate: 128000  # 128kbps

# SFU 配置
SFU:
  # 最大房间数
  MaxRooms: 1000
  # 每个房间最大用户数
  MaxUsersPerRoom: 50
  # 房间超时时间(秒)
  RoomTimeout: 3600
  # 用户连接超时时间(秒)
  UserTimeout: 300

# 信令服务器配置
Signaling:
  # WebSocket 配置
  WebSocket:
    ReadBufferSize: 4096
    WriteBufferSize: 4096
    CheckOrigin: true
  
  # 消息队列配置
  MessageQueue:
    BufferSize: 1000
    WorkerCount: 10

# 各个微服务的RPC配置
SocialRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: social.rpc
    Timeout: 2000
    NonBlock: true

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
    Timeout: 2000
    NonBlock: true

ImRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: im.rpc
    Timeout: 2000
    NonBlock: true
