Name: im.ws
ListenOn: 0.0.0.0:10091

Mysql:
  DataSource: root:123456789@tcp(mysql:3306)/hichat2?charset=utf8mb4&parseTime=true

Cache:
  - Host: redis:6379
    Type: node

MsgChatTransfer:
  Name: msgChatTransfer
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: msgChatTransfer
  Offset: first
  Consumers: 1

MsgReadTransfer:
  Name: msgReadTrans
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: msgReadTransfer
  Offset: first
  Consumers: 1

MsgRecallTransfer:
  Name: msgRecallTrans
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: msgRecallTransfer
  Offset: first
  Consumers: 1

TrendNotifyTransfer:
  Name: trendNotifyTrans
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: trendNotifyTransfer
  Offset: first
  Consumers: 1

Ws:
  Host: im-ws:10090

SocialRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: social.rpc

UserRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc

ImRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: im.rpc

RelationChangeTransfer:
  Name: relationChangeTrans
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: relationChangeTransfer
  Offset: first

CommonNotifyTransfer:
  Name: commonNotifyTrans
  Brokers:
    - kafka:9092
  Group: kafka
  Topic: commonNotifyTransfer
  Offset: first
  Consumers: 1

# 发送鉴权灰度开关
AuthzGate:
  Enabled: true
  GroupChat: true
  SingleChat: true
