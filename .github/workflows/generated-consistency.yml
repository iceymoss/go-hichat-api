name: Generated consistency

on:
  pull_request:
    paths:
      - "apps/social/api/**"
      - "apps/social/rpc/**"
      - "apps/im/api/**"
      - "apps/im/rpc/**"
      - "scripts/check-generated-consistency.sh"
      - ".github/workflows/generated-consistency.yml"
  push:
    paths:
      - "apps/social/api/**"
      - "apps/social/rpc/**"
      - "apps/im/api/**"
      - "apps/im/rpc/**"
      - "scripts/check-generated-consistency.sh"
      - ".github/workflows/generated-consistency.yml"

permissions:
  contents: read

jobs:
  generated-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned generators
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.8.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Check generated code
        run: ./scripts/check-generated-consistency.sh --committed
